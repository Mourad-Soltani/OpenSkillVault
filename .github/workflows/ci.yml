# CI — Mourad.Soltani
name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: Pytest
        run: pytest -q
      - name: Health smoke
        run: |
          python -c "from backend.app import app; c=app.test_client(); r=c.get('/health'); assert r.status_code==200"
